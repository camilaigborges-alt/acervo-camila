<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#b85c2b"><title>Acervo Camila — Gestão de Brechó</title>
<style>
:root{--t:#b85c2b;--td:#8f3f1d;--c:#fff8f1;--p:#f6e4d6;--b:#4b2d20;--l:#ead5c5;--g:#3e7d5a;--r:#a43f38}*{box-sizing:border-box}body{margin:0;background:var(--c);color:var(--b);font-family:Arial,Helvetica,sans-serif}.top{height:66px;background:linear-gradient(90deg,var(--td),var(--t));color:#fff;display:flex;align-items:center;padding:8px 18px;position:sticky;top:0;z-index:10}.brand{display:flex;gap:12px;align-items:center}.logo{width:58px;height:58px;object-fit:contain;border-radius:8px;background:#fff;border:1px solid #fff8;padding:2px}.brand h1{font-size:20px;margin:0}.brand small{display:block}.layout{display:flex;min-height:calc(100vh - 66px)}aside{width:235px;background:#fff;border-right:1px solid var(--l);padding:14px;position:sticky;top:66px;height:calc(100vh - 66px);overflow:auto}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:var(--b);padding:11px;text-align:left;border-radius:9px;cursor:pointer}.nav button:hover,.nav button.active{background:var(--p);font-weight:700}main{flex:1;padding:22px;max-width:1500px;width:100%;margin:auto}.view{display:none}.view.active{display:block}.hero,.card,.form{background:#fff;border:1px solid var(--l);border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 7px 20px #4b2d2012}.hero{background:linear-gradient(135deg,#fff,var(--p))}.hero h2{margin:0 0 5px}.hero p{margin:0}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.card .n{font-size:26px;font-weight:800;margin-top:6px}.muted{color:#866b5c;font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.fg{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:9px;border:1px solid #d9bda9;border-radius:8px;background:#fff}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}button.primary,.primary{background:var(--t);color:#fff;padding:10px 14px;border:0;border-radius:8px;font-weight:700;cursor:pointer}button.secondary,.secondary{background:var(--p);color:var(--b);padding:10px 14px;border:0;border-radius:8px;cursor:pointer}button.danger,.danger{background:#f4d5d2;color:#7b2721;padding:8px 11px;border:0;border-radius:8px;cursor:pointer}button.success,.success{background:#dceee3;color:#275b3d;padding:8px 11px;border:0;border-radius:8px;cursor:pointer}table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--l);border-radius:12px;overflow:hidden}th,td{padding:9px;border-bottom:1px solid #f0e1d5;text-align:left;font-size:13px;vertical-align:middle}th{background:var(--p)}.thumb{width:58px;height:58px;object-fit:cover;border-radius:8px;border:1px solid var(--l)}.badge{padding:4px 8px;border-radius:15px;font-size:11px;font-weight:700}.ok{background:#dceee3;color:#275b3d}.no{background:#f4d5d2;color:#7b2721}.warn{background:#fff0c9;color:#795a12}.toolbar{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.toolbar input{padding:9px;border:1px solid #d9bda9;border-radius:8px;min-width:240px}.empty{text-align:center;padding:24px;color:#866b5c}.mobile{display:none}
@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.fg{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){aside{display:none}.layout{min-height:calc(100vh - 66px)}main{padding:12px;padding-bottom:75px}.fg,.grid{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,1fr);gap:8px}.mobile{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--l);z-index:20;padding:6px;gap:4px}.mobile button{flex:1;border:0;background:var(--p);padding:8px 3px;border-radius:7px;font-size:10px}.brand h1{font-size:17px}}
@media print{.top,aside,.mobile,.actions,.toolbar{display:none!important}main{padding:0}.view{display:none!important}.view.print{display:block!important}}
.syncbar{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px}.sync-dot{width:9px;height:9px;border-radius:50%;background:#e0a400;display:inline-block}.sync-dot.ok{background:#3e7d5a}.sync-dot.bad{background:#a43f38}.login-overlay{position:fixed;inset:0;background:#fff8f1;display:none;align-items:center;justify-content:center;z-index:100}.login-card{width:min(420px,92vw);background:#fff;border:1px solid #ead5c5;border-radius:18px;padding:24px;box-shadow:0 12px 40px #4b2d2020}.login-card h2{margin-top:0}.login-card input{width:100%;padding:11px;border:1px solid #d9bda9;border-radius:9px;margin:5px 0 12px}.login-card .msg{min-height:20px;font-size:13px;margin:8px 0}.logout{background:#fff;color:#fff;border:1px solid #fff8;padding:6px 9px;border-radius:7px;cursor:pointer}.userbtn{background:#fff2;color:#fff;border:1px solid #fff8;padding:6px 9px;border-radius:7px;cursor:pointer}.auth-actions{display:flex;gap:8px;flex-wrap:wrap}.smallnote{font-size:12px;color:#866b5c;line-height:1.5}
</style>

async function addProd(){var p={id:id(),codigo:pval('p_cod'),nome:pval('p_nome'),marca:pval('p_marca'),tamanho:pval('p_tam'),fornecedorId:pval('p_forn'),preco:Number(pval('p_preco')||0),status:'disponível',data:today(),foto:''},f=document.getElementById('p_foto').files[0];if(!p.nome){alert('Informe o nome da peça.');return}if(f&&currentUser){setSync('Enviando foto…','');var ext=(f.name.split('.').pop()||'jpg').toLowerCase(),path=currentUser.id+'/'+p.id+'.'+ext;var up=await supabase.storage.from('fotos-estoque').upload(path,f,{contentType:f.type||'image/jpeg',upsert:true});if(up.error){alert('Não foi possível enviar a foto: '+up.error.message);setSync('Erro na foto','bad');return}p.foto=path}else if(f){savePhoto(f,function(x){p.foto=x;db.produtos.push(p);save();prod();alert('Peça cadastrada com foto local. Entre na conta para sincronizar fotos.')});return}db.produtos.push(p);save();prod();alert(f?'Peça cadastrada e foto sincronizada.':'Peça cadastrada.')}

function photo(k,cb){if(!k){cb('');return}if(currentUser&&k.indexOf(currentUser.id+'/')===0){supabase.storage.from('fotos-estoque').createSignedUrl(k,3600).then(function(r){cb(r.data&&r.data.signedUrl?r.data.signedUrl:'')});return}if(!photoStore){setTimeout(function(){photo(k,cb)},100);return}var r=photoStore.transaction('photos','readonly').objectStore('photos').get(k);r.onsuccess=function(){if(r.result instanceof Blob)cb(URL.createObjectURL(r.result));else cb('')}}

function addSale(){var pid=pval('s_p'),p=db.produtos.find(function(x){return x.id===pid});if(!p){alert('Selecione uma peça.');return}var val=Number(pval('s_val')||p.preco);if(val<=0){alert('Informe o valor.');return}var form=pval('s_pag'),q=form==='Cartão de crédito'?Number(pval('s_q')||1):1,taxa=Number(pval('s_taxa')||0),v={id:id(),produtoId:pid,clienteId:pval('s_c'),valor:val,forma:form,parcelas:q,taxa:taxa,data:pval('s_data')||today(),venc:pval('s_venc')||today()};db.vendas.push(v);p.status='vendido';if(form==='Cartão de crédito'){var base=Number((val/q).toFixed(2)),rest=val;for(var i=1;i<=q;i++){var pv=i===q?Number(rest.toFixed(2)):base;rest-=pv;var d=new Date(v.venc+'T12:00:00');d.setMonth(d.getMonth()+i-1);db.parcelas.push({id:id(),vendaId:v.id,numero:i,total:q,valor:pv,taxa:taxa,liquido:Number((pv*(1-taxa/100)).toFixed(2)),venc:d.toISOString().slice(0,10),status:'pendente'})}}else{db.recebimentos.push({id:id(),vendaId:v.id,valor:val,data:today(),forma:form,obs:'Recebimento imediato'})}save();sale();alert('Venda registrada com sucesso.')}

function dev(){var fs=db.fornecedores.map(function(f){return '<option value="'+f.id+'">'+esc(f.nome)+'</option>'}).join(''),ps=db.produtos.map(function(p){return '<option value="'+p.id+'">'+esc(p.nome)+' — '+esc(p.codigo)+'</option>'}).join('');document.getElementById('c_dev').innerHTML='<div class="form"><div class="fg"><div class="field"><label>Fornecedor</label><select id="d_f">'+fs+'</select></div><div class="field"><label>Peça</label><select id="d_p">'+ps+'</select></div>'+field('Motivo','d_m','text','Motivo')+field('Data','d_d','date','')+'</div><div class="actions"><button class="primary" onclick="addDev()">Gerar protocolo</button></div></div><div id="dt"></div>';document.getElementById('d_d').value=today();listDev()}
function addDev(){var f=pval('d_f'),p=pval('d_p');if(!f||!p){alert('Selecione fornecedor e peça.');return}var x={id:id(),numero:'DEV-'+Date.now().toString().slice(-6),fornecedorId:f,produtoId:p,motivo:pval('d_m'),data:pval('d_d')||today()};db.devolucoes.push(x);var pr=db.produtos.find(function(y){return y.id===p});if(pr)pr.status='devolvida';save();dev();printDev(x.id)}
function listDev(){var rows=db.devolucoes.slice().reverse().map(function(x){var f=db.fornecedores.find(function(y){return y.id===x.fornecedorId}),p=db.produtos.find(function(y){return y.id===x.produtoId});return '<tr><td>'+x.numero+'</td><td>'+esc(x.data)+'</td><td>'+esc(f?f.nome:'')+'</td><td>'+esc(p?p.nome:'')+'</td><td>'+esc(x.motivo)+'</td><td><button class="secondary" onclick="printDev(\''+x.id+'\')">Imprimir</button></td></tr>'}).join('');document.getElementById('dt').innerHTML=rows?'<table><tr><th>Protocolo</th><th>Data</th><th>Fornecedor</th><th>Peça</th><th>Motivo</th><th></th></tr>'+rows+'</table>':'<div class="empty">Nenhuma devolução.</div>'}
function printDev(xid){var x=db.devolucoes.find(function(y){return y.id===xid}),f=db.fornecedores.find(function(y){return y.id===x.fornecedorId}),p=db.produtos.find(function(y){return y.id===x.produtoId}),w=window.open('','_blank');w.document.write('<html><body style="font-family:Arial;padding:35px;color:#4b2d20"><h1 style="color:#b85c2b">ACERVO CAMILA</h1><h2>PROTOCOLO DE DEVOLUÇÃO</h2><p>Nº: '+x.numero+'</p><p>Data: '+esc(x.data)+'</p><p>Fornecedor: '+esc(f?f.nome:'')+'</p><p>Peça: '+esc(p?p.nome:'')+'</p><p>Motivo: '+esc(x.motivo)+'</p><br><p>Declaro o recebimento da peça acima.</p><div style="margin-top:80px;display:flex;justify-content:space-between"><div>________________________<br>Acervo Camila</div><div>________________________<br>Fornecedor</div></div><script>window.print()<\/script></body></html>');w.document.close()}
function rel(){var sales=db.vendas.reduce(function(s,x){return s+x.valor},0),rec=db.recebimentos.reduce(function(s,x){return s+x.valor},0),des=db.despesas.reduce(function(s,x){return s+x.valor},0),repv=db.repasses.reduce(function(s,x){return s+x.valor},0),stock=db.produtos.filter(function(x){return x.status==='disponível'}).reduce(function(s,x){return s+x.preco},0);document.getElementById('c_rel').innerHTML='<div class="cards"><div class="card"><div class="muted">Vendas</div><div class="n">'+br(sales)+'</div></div><div class="card"><div class="muted">Recebido</div><div class="n">'+br(rec)+'</div></div><div class="card"><div class="muted">Despesas</div><div class="n">'+br(des)+'</div></div><div class="card"><div class="muted">Repasses pagos</div><div class="n">'+br(repv)+'</div></div></div><div class="grid"><div class="card"><h3>Valor do estoque disponível</h3><div class="n">'+br(stock)+'</div></div><div class="card"><h3>Caixa registrado</h3><div class="n">'+br(rec-des-repv)+'</div></div></div><div class="actions"><button class="primary" onclick="window.print()">Imprimir relatório</button></div>'}
function bak(){document.getElementById('c_bak').innerHTML='<div class="form"><h3>Backup</h3><p>Exporte seus dados regularmente.</p><div class="actions"><button class="primary" onclick="exportData()">Exportar backup</button><label class="secondary">Importar backup<input type="file" accept=".json" style="display:none" onchange="importData(this)"></label><button class="danger" onclick="wipe()">Apagar dados</button></div></div><div class="card"><h3>Importante</h3><p>Esta versão está preparada para sincronizar os dados e as fotos pelo Supabase quando você entrar na mesma conta no PC e no iPhone.</p><p>Use o mesmo e-mail e senha nos dois aparelhos para acessar o mesmo estoque. Faça backup também como segurança.</p></div>'}
function exportData(){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='backup-acervo-camila-'+today()+'.json';a.click()}
function importData(inp){var f=inp.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var x=JSON.parse(r.result);if(!x.produtos)throw 0;db=Object.assign(db,x);save();build();alert('Backup restaurado.')}catch(e){alert('Backup inválido.')}};r.readAsText(f)}
function wipe(){if(confirm('Apagar todos os dados deste navegador?')){localStorage.removeItem(KEY);db=load();build()}}
function del(t,x){if(!confirm('Excluir este registro?'))return;db[t]=db[t].filter(function(y){return y.id!==x});save();build()}
window.go=go;window.addProd=addProd;window.listProd=listProd;window.addForn=addForn;window.addCli=addCli;window.addSale=addSale;window.toggleCard=toggleCard;window.recibo=recibo;window.addRec=addRec;window.payPar=payPar;window.repPay=repPay;window.addExp=addExp;window.addDev=addDev;window.printDev=printDev;window.exportData=exportData;window.importData=importData;window.wipe=wipe;window.del=del;
initPhotos();build();
(async function bootSync(){var r=await supabase.auth.getSession();currentUser=r.data&&r.data.session?r.data.session.user:null;if(currentUser){document.getElementById('authUser').style.display='inline-block';document.getElementById('authUser').textContent='Sair';document.getElementById('authUser').onclick=authLogout;closeAuth();await syncLoad()}else{setSync('Entre para sincronizar','');openAuth()}})();
supabase.auth.onAuthStateChange(function(event,session){currentUser=session?session.user:null;if(currentUser){document.getElementById('authUser').style.display='inline-block';document.getElementById('authUser').textContent='Sair';document.getElementById('authUser').onclick=authLogout;closeAuth();syncLoad()}else{document.getElementById('authUser').style.display='none';setSync('Entre para sincronizar','')}});
supabase.channel('acervo-sync').on('postgres_changes',{event:'*',schema:'public',table:'acervo_data'},function(payload){if(currentUser&&payload.new&&payload.new.user_id===currentUser.id&&!syncBusy){remoteApplying=true;db=Object.assign(emptyDb(),payload.new.data||{});localStorage.setItem(KEY,JSON.stringify(db));remoteApplying=false;build();setSync('Atualizado','ok')}}).subscribe();
})();
</script></body></html>

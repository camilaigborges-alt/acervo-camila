<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Acervo Camila • Gestão</title>

<style>
:root{
--creme:#fff8f2;--fundo:#f8e9dc;--pessego:#f3cdb5;
--cobre:#b85b2b;--terr:#9a431f;--marrom:#4b2115;
--dourado:#c9894b;--linha:#ead0bd;--branco:#fff;
--verde:#397d58;--vermelho:#a43c35;
}
*{box-sizing:border-box}
body{margin:0;background:var(--creme);color:var(--marrom);font-family:Arial,sans-serif}
header{
background:linear-gradient(90deg,var(--terr),var(--cobre));
color:#fff;padding:10px 18px;display:flex;align-items:center;
justify-content:space-between;gap:12px;position:sticky;top:0;z-index:20
}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:46px;height:46px;object-fit:contain;border-radius:50%;background:#fff}
.brand b{font-size:18px}.brand small{display:block;opacity:.9}
#date{font-size:13px}
nav{display:flex;gap:4px;overflow:auto;background:var(--fundo);
padding:8px 12px;position:sticky;top:66px;z-index:19;border-bottom:1px solid var(--linha)}
nav button{border:0;background:transparent;color:var(--marrom);padding:9px 12px;
border-radius:9px;cursor:pointer;font-weight:bold;white-space:nowrap}
nav button.on{background:var(--terr);color:#fff}
main{max-width:1200px;margin:auto;padding:18px}
.hero{background:linear-gradient(135deg,#fffaf6,#f5d5c0);
border:1px solid var(--linha);padding:20px;border-radius:18px;margin-bottom:15px}
.hero h2{margin:0 0 6px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.card{background:#fff;border:1px solid var(--linha);border-radius:12px;padding:14px}
.card h3{margin:0 0 7px;font-size:14px}
.big{font-size:23px;font-weight:bold}
.form{background:#fff;border:1px solid var(--linha);border-radius:12px;padding:15px;margin-bottom:14px}
.formgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
label{display:block;font-size:13px;font-weight:bold;margin-top:5px}
input,select,textarea{
width:100%;padding:10px;border:1px solid #dfc8b7;border-radius:8px;
background:#fff;font:inherit;color:inherit
}
button.primary{background:var(--terr);color:white;border:0;border-radius:8px;
padding:10px 14px;cursor:pointer;font-weight:bold}
button.secondary{background:#f0dfd1;color:var(--marrom);border:0;border-radius:8px;
padding:10px 14px;cursor:pointer}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--linha);
border-radius:12px;overflow:hidden}
th,td{padding:9px;border-bottom:1px solid #eddcd0;text-align:left;font-size:13px}
th{background:#f1ddcf}
.badge{padding:4px 8px;border-radius:20px;font-size:11px;font-weight:bold}
.pago{background:#d9efdf;color:var(--verde)}
.pendente{background:#f8ddd8;color:var(--vermelho)}
.vencido{background:#f2c5c0;color:#8b2924}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.receipt{border:1px solid #bbb;padding:30px;background:#fff;max-width:700px;margin:auto}
.receipt h1{text-align:center;color:var(--terr)}
.line{border-bottom:1px solid #aaa;margin:14px 0}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;
justify-content:center;z-index:100;padding:20px}
.modal.open{display:flex}
.modalbox{background:#fff;width:min(750px,100%);max-height:90vh;overflow:auto;
border-radius:14px;padding:20px}
.no-print{display:block}
@media(max-width:800px){
.grid,.formgrid{grid-template-columns:1fr 1fr}
}
@media(max-width:600px){
.grid,.formgrid{grid-template-columns:1fr}
nav{top:66px}
}
@media print{
header,nav,.no-print{display:none!important}
body{background:#fff}.modal{position:static;background:none}
.modalbox{box-shadow:none;width:100%;max-height:none}
}
</style>
</head>

<body>

<header>
<div class="brand">
<img src="logo-acervo-camila.jpg" onerror="this.style.display='none'">
<div><b>ACERVO CAMILA</b><small>Sistema de Gestão de Brechó</small></div>
</div>
<div id="date"></div>
</header>

<nav id="nav"></nav>
<main id="app"></main>

<div id="modal" class="modal">
<div class="modalbox" id="modalbox"></div>
</div>

<script>
const tabs=[
["home","Início"],["prod","Estoque"],["forn","Fornecedores"],
["cli","Clientes"],["venda","Vendas"],["receb","Recebimentos"],
["cartao","Cartão / Parcelas"],["rep","Relatórios"],["desp","Despesas"],
["backup","Backup"]
];

let db=JSON.parse(localStorage.getItem("acervoCamilaPro2")||"null")||{
fornecedores:[],produtos:[],clientes:[],vendas:[],recebimentos:[],
parcelas:[],despesas:[]
};

let atual="home";

function save(){
localStorage.setItem("acervoCamilaPro2",JSON.stringify(db));
render();
}

function uid(){
return Date.now().toString(36)+Math.random().toString(36).slice(2,8);
}

function hoje(){
return new Date().toISOString().slice(0,10);
}

function br(v){
return Number(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
}

function dataBR(v){
if(!v)return "";
let p=v.split("-");
return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:v;
}

function esc(v){
return String(v??"").replace(/[&<>"']/g,m=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[m]));
}

function nav(){
document.getElementById("nav").innerHTML=tabs.map(x=>
`<button class="${atual===x[0]?"on":""}" onclick="show('${x[0]}')">${x[1]}</button>`
).join("");
}

function show(t){
atual=t;
render();
window.scrollTo(0,0);
}

function render(){
nav();
document.getElementById("date").textContent=new Date().toLocaleDateString("pt-BR");
const a=document.getElementById("app");

if(atual==="home")home(a);
if(atual==="prod")prod(a);
if(atual==="forn")forn(a);
if(atual==="cli")cli(a);
if(atual==="venda")venda(a);
if(atual==="receb")receb(a);
if(atual==="cartao")cartao(a);
if(atual==="rep")relatorios(a);
if(atual==="desp")desp(a);
if(atual==="backup")backup(a);
}

/* INÍCIO */
function home(a){
let estoque=db.produtos.filter(x=>x.status!=="vendido").length;
let vendido=db.vendas.reduce((s,x)=>s+Number(x.valor||0),0);
let recebido=db.recebimentos.filter(x=>x.status==="pago")
.reduce((s,x)=>s+Number(x.valor||0),0);
let pend=db.parcelas.filter(x=>x.status!=="pago")
.reduce((s,x)=>s+Number(x.valor||0),0);

a.innerHTML=`
<div class="hero">
<h2>Bem-vinda ao Acervo Camila 🌷</h2>
<p>Controle seu brechó, estoque, fornecedores, clientes, vendas e recebimentos.</p>
</div>

<div class="grid">
<div class="card"><h3>Peças em estoque</h3><div class="big">${estoque}</div></div>
<div class="card"><h3>Total de vendas</h3><div class="big">${br(vendido)}</div></div>
<div class="card"><h3>Total recebido</h3><div class="big">${br(recebido)}</div></div>
<div class="card"><h3>Parcelas a receber</h3><div class="big">${br(pend)}</div></div>
</div>

<div class="form">
<h3>Acesso rápido</h3>
<div class="actions">
<button class="primary" onclick="show('prod')">+ Cadastrar peça</button>
<button class="primary" onclick="show('venda')">+ Registrar venda</button>
<button class="secondary" onclick="show('cartao')">💳 Ver parcelas</button>
<button class="secondary" onclick="show('receb')">💰 Recebimentos</button>
</div>
</div>`;
}

/* ESTOQUE */
function prod(a){
let rows=db.produtos.map(p=>`
<tr>
<td>
${p.foto ? `<img src="${p.foto}" style="width:70px;height:70px;object-fit:cover;border-radius:8px;">` : "Sem foto"}
</td>
<td>${esc(p.codigo)}</td>
<td>${esc(p.nome)}</td>
<td>${esc(p.marca)}</td>
<td>${esc(p.tamanho)}</td>
<td>${esc(p.fornecedor||"-")}</td>
<td>${br(p.preco)}</td>
<td><span class="badge ${p.status==="vendido"?"pendente":"pago"}">${p.status==="vendido"?"Vendido":"Disponível"}</span></td>
<td><button class="secondary" onclick="excluir('produtos','${p.id}')">Excluir</button></td>
</tr>`).join("");
a.innerHTML=`
<div class="hero"><h2>Estoque</h2><p>Controle das peças e do fornecedor de cada item.</p></div>

<div class="form">
<h3>Cadastrar peça</h3>
<div class="formgrid">
<div><label>Código</label><input id="p_codigo"></div>
<div><label>Peça</label><input id="p_nome"></div>
<div><label>Marca</label><input id="p_marca"></div>
<div><label>Tamanho</label><input id="p_tamanho"></div>
<div><label>Foto da peça</label><input id="p_foto" type="file" accept="image/*"></div>
<div><label>Fornecedor</label><input id="p_fornecedor"></div>
<div><label>Valor de venda</label><input id="p_preco" type="number" step=".01"></div>
</div>
<div class="actions"><button class="primary" onclick="addProd()">Cadastrar peça</button></div>
</div>

<table>
<tr>
<th>Foto</th>
<th>Código</th>
<th>Peça</th>
<th>Marca</th>
<th>Tamanho</th>
<th>Fornecedor</th>
<th>Venda</th>
<th>Status</th>
<th>Ação</th>
</tr>
${rows||"<tr><td colspan=9>Nenhuma peça cadastrada.</td></tr>"}
</table>
}

function addProd(){
  const fotoInput=document.getElementById("p_foto");
  const salvarProduto=(foto="")=>{
    db.produtos.push({
      id:uid(),
      codigo:val("p_codigo"),
      nome:val("p_nome"),
      marca:val("p_marca"),
      tamanho:val("p_tamanho"),
      fornecedor:val("p_fornecedor"),
      preco:Number(val("p_preco")||0),
      foto:foto,
      status:"disponível"
    });
    save();
  };

  if(fotoInput.files && fotoInput.files[0]){
    const reader=new FileReader();
    reader.onload=function(e){
      salvarProduto(e.target.result);
    };
    reader.readAsDataURL(fotoInput.files[0]);
  }else{
    salvarProduto("");
  }
}

/* FORNECEDORES */
function forn(a){
  let rows=db.fornecedores.map(function(f){
    return "<tr><td>"+esc(f.nome)+"</td><td>"+esc(f.telefone)+"</td><td>"+esc(f.obs)+"</td><td><button class='secondary' onclick=\"excluirFornecedor('"+f.id+"')\">Excluir</button></td></tr>";
  }).join("");

  a.innerHTML=`
  <div class="hero"><h2>Fornecedores</h2><p>Controle quem deixou peças no Acervo Camila.</p></div>
  <div class="form">
  <div class="formgrid">
  <div><label>Nome</label><input id="f_nome"></div>
  <div><label>Telefone</label><input id="f_tel"></div>
  <div><label>Observação</label><input id="f_obs"></div>
  </div>
  <div class="actions"><button class="primary" onclick="addForn()">Cadastrar fornecedor</button></div>
  </div>
  <table><tr><th>Nome</th><th>Telefone</th><th>Observação</th><th></th></tr>
  ${rows||"<tr><td colspan=4>Nenhum fornecedor cadastrado.</td></tr>"}</table>`;
}

function addForn(){
db.fornecedores.push({id:uid(),nome:val("f_nome"),telefone:val("f_tel"),obs:val("f_obs")});
save();
}

/* CLIENTES */
function cli(a){
let rows=db.clientes.map(c=>`
<tr><td>${esc(c.nome)}</td><td>${esc(c.telefone)}</td><td>${esc(c.obs)}</td>
<td><button class="secondary" onclick="excluir('clientes','${c.id}')">Excluir</button></td></tr>`).join("");

a.innerHTML=`
<div class="hero"><h2>Clientes</h2></div>
<div class="form">
<div class="formgrid">
<div><label>Nome</label><input id="c_nome"></div>
<div><label>Telefone</label><input id="c_tel"></div>
<div><label>Observação</label><input id="c_obs"></div>
</div>
<div class="actions"><button class="primary" onclick="addCli()">Cadastrar cliente</button></div>
</div>
<table><tr><th>Nome</th><th>Telefone</th><th>Observação</th><th></th></tr>
${rows||"<tr><td colspan=4>Nenhum cliente cadastrado.</td></tr>"}</table>`;
}

function addCli(){
db.clientes.push({id:uid(),nome:val("c_nome"),telefone:val("c_tel"),obs:val("c_obs")});
save();
}

/* VENDA */
function venda(a){
let disponiveis=db.produtos.filter(p=>p.status!=="vendido");

a.innerHTML=`
<div class="hero"><h2>Registrar venda</h2>
<p>Ao escolher cartão de crédito, o sistema cria automaticamente as parcelas.</p></div>

<div class="form">
<div class="formgrid">
<div><label>Peça</label>
<select id="v_prod">
<option value="">Selecione</option>
${disponiveis.map(p=>`<option value="${p.id}">${esc(p.nome)} • ${esc(p.marca)} • ${br(p.preco)}</option>`).join("")}
</select></div>

<div><label>Cliente</label>
<select id="v_cli">
<option value="">Não informado</option>
${db.clientes.map(c=>`<option value="${c.id}">${esc(c.nome)}</option>`).join("")}
</select></div>

<div><label>Valor da venda</label><input id="v_valor" type="number" step=".01"></div>

<div><label>Forma de pagamento</label>
<select id="v_pag" onchange="mostrarParcelas()">
<option>PIX</option>
<option>Dinheiro</option>
<option>Cartão de débito</option>
<option>Cartão de crédito</option>
</select></div>

<div id="boxParcelas" style="display:none">
<label>Número de parcelas</label>
<select id="v_parcelas">
<option>1</option><option>2</option><option>3</option>
<option>4</option><option>5</option><option>6</option>
<option>7</option><option>8</option><option>9</option>
<option>10</option><option>11</option><option>12</option>
</select>
</div>

<div><label>Data da venda</label><input id="v_data" type="date" value="${hoje()}"></div>

<div><label>Primeiro vencimento</label><input id="v_venc" type="date" value="${hoje()}"></div>
</div>

<div class="actions">
<button class="primary" onclick="registrarVenda()">Registrar venda</button>
</div>
</div>`;
}

function mostrarParcelas(){
document.getElementById("boxParcelas").style.display=
val("v_pag")==="Cartão de crédito"?"block":"none";
}

function registrarVenda(){
let pid=val("v_prod");
let p=db.produtos.find(x=>x.id===pid);
if(!p){alert("Selecione uma peça.");return}

let valor=Number(val("v_valor")||p.preco);
let forma=val("v_pag");
let qtd=forma==="Cartão de crédito"?Number(val("v_parcelas")||1):1;
let data=val("v_data")||hoje();
let venc=val("v_venc")||data;

let venda={
id:uid(),produtoId:pid,
clienteId:val("v_cli"),
valor,forma,data,parcelas:qtd
};

db.vendas.push(venda);
p.status="vendido";

if(forma==="Cartão de crédito"){
let valorParcela=Number((valor/qtd).toFixed(2));
let soma=0;

for(let i=1;i<=qtd;i++){
let vp=i===qtd?Number((valor-soma).toFixed(2)):valorParcela;
soma+=vp;

let d=new Date(venc+"T12:00:00");
d.setMonth(d.getMonth()+i-1);

db.parcelas.push({
id:uid(),
vendaId:venda.id,
numero:i,
total:qtd,
valor:vp,
vencimento:d.toISOString().slice(0,10),
status:"pendente"
});
}
}else{
db.recebimentos.push({
id:uid(),vendaId:venda.id,
valor,data,status:"pago",forma
});
}

save();
alert("Venda registrada com sucesso!");
}

/* RECEBIMENTOS */
function receb(a){
let rows=db.recebimentos.map(r=>`
<tr><td>${dataBR(r.data)}</td>
<td>${br(r.valor)}</td><td>${esc(r.forma)}</td>
<td><span class="badge ${r.status==="pago"?"pago":"pendente"}">${esc(r.status)}</span></td>
</tr>`).join("");

a.innerHTML=`
<div class="hero"><h2>Recebimentos</h2>
<p>Valores efetivamente recebidos pelo Acervo Camila.</p></div>
<table>
<tr><th>Data</th><th>Valor</th><th>Forma</th><th>Status</th></tr>
${rows||"<tr><td colspan=4>Nenhum recebimento registrado.</td></tr>"}
</table>`;
}

/* CARTÃO E PARCELAS */
function cartao(a){
let hojeData=hoje();

let total=db.parcelas.reduce((s,p)=>s+Number(p.valor||0),0);
let pago=db.parcelas.filter(p=>p.status==="pago")
.reduce((s,p)=>s+Number(p.valor||0),0);
let pend=total-pago;

let rows=db.parcelas.map(p=>{
let venda=db.vendas.find(v=>v.id===p.vendaId);
let cliente=db.clientes.find(c=>c.id===venda?.clienteId);
let vencida=p.status!=="pago"&&p.vencimento<hojeData;

let status=vencida?"vencido":p.status;
return `
<tr>
<td>${dataBR(p.vencimento)}</td>
<td>${cliente?esc(cliente.nome):"Cliente não informado"}</td>
<td>${p.numero}/${p.total}</td>
<td>${br(p.valor)}</td>
<td><span class="badge ${status==="pago"?"pago":status==="vencido"?"vencido":"pendente"}">
${status==="pago"?"Paga":status==="vencido"?"Vencida":"Pendente"}
</span></td>
<td>
${p.status!=="pago"?
`<button class="primary" onclick="pagarParcela('${p.id}')">Marcar paga</button>`:""}
</td>
</tr>`;
}).join("");

a.innerHTML=`
<div class="hero">
<h2>💳 Cartão de crédito e parcelas</h2>
<p>Acompanhe exatamente quanto já entrou e quanto ainda falta receber.</p>
</div>

<div class="grid">
<div class="card"><h3>Total parcelado</h3><div class="big">${br(total)}</div></div>
<div class="card"><h3>Já recebido</h3><div class="big">${br(pago)}</div></div>
<div class="card"><h3>A receber</h3><div class="big">${br(pend)}</div></div>
<div class="card"><h3>Parcelas</h3><div class="big">${db.parcelas.length}</div></div>
</div>

<div class="form">
<h3>Controle de parcelas</h3>
<table>
<tr><th>Vencimento</th><th>Cliente</th><th>Parcela</th>
<th>Valor</th><th>Status</th><th>Ação</th></tr>
${rows||"<tr><td colspan=6>Nenhuma parcela cadastrada.</td></tr>"}
</table>
</div>`;
}

function pagarParcela(id){
let p=db.parcelas.find(x=>x.id===id);
if(!p)return;

p.status="pago";

db.recebimentos.push({
id:uid(),
vendaId:p.vendaId,
valor:p.valor,
data:hoje(),
status:"pago",
forma:"Cartão de crédito"
});

save();
}

/* DESPESAS */
function desp(a){
let rows=db.despesas.map(d=>`
<tr><td>${dataBR(d.data)}</td><td>${esc(d.descricao)}</td>
<td>${br(d.valor)}</td>
<td><button class="secondary" onclick="excluir('despesas','${d.id}')">Excluir</button></td></tr>`).join("");

a.innerHTML=`
<div class="hero"><h2>Despesas</h2></div>
<div class="form">
<div class="formgrid">
<div><label>Descrição</label><input id="d_desc"></div>
<div><label>Valor</label><input id="d_valor" type="number" step=".01"></div>
<div><label>Data</label><input id="d_data" type="date" value="${hoje()}"></div>
</div>
<div class="actions"><button class="primary" onclick="addDesp()">Cadastrar despesa</button></div>
</div>
<table><tr><th>Data</th><th>Descrição</th><th>Valor</th><th></th></tr>
${rows||"<tr><td colspan=4>Nenhuma despesa cadastrada.</td></tr>"}</table>`;
}

function addDesp(){
db.despesas.push({
id:uid(),descricao:val("d_desc"),valor:Number(val("d_valor")||0),data:val("d_data")||hoje()
});
save();
}

/* RELATÓRIOS */
function relatorios(a){
let vendas=db.vendas.reduce((s,v)=>s+Number(v.valor||0),0);
let receb=db.recebimentos.filter(r=>r.status==="pago")
.reduce((s,r)=>s+Number(r.valor||0),0);
let despesas=db.despesas.reduce((s,d)=>s+Number(d.valor||0),0);
let aReceber=db.parcelas.filter(p=>p.status!=="pago")
.reduce((s,p)=>s+Number(p.valor||0),0);

a.innerHTML=`
<div class="hero"><h2>Relatórios</h2>
<p>Visão financeira do Acervo Camila.</p></div>

<div class="grid">
<div class="card"><h3>Vendas</h3><div class="big">${br(vendas)}</div></div>
<div class="card"><h3>Recebido</h3><div class="big">${br(receb)}</div></div>
<div class="card"><h3>Despesas</h3><div class="big">${br(despesas)}</div></div>
<div class="card"><h3>A receber</h3><div class="big">${br(aReceber)}</div></div>
</div>

<div class="form">
<h3>Resultado recebido</h3>
<p><b>${br(receb-despesas)}</b></p>
</div>`;
}

/* BACKUP */
function backup(a){
a.innerHTML=`
<div class="hero">
<h2>Backup dos dados</h2>
<p>Faça uma cópia dos dados para não perder seus cadastros.</p>
</div>

function baixarBackup(){
let blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"});
let a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="backup-acervo-camila.json";
a.click();
}

function restaurarBackup(e){
let file=e.target.files[0];
if(!file)return;
let reader=new FileReader();

reader.onload=function(){
try{
let dados=JSON.parse(reader.result);
if(!dados.produtos||!dados.vendas)throw Error();
db=dados;
save();
alert("Backup restaurado!");
}catch(err){
alert("Arquivo de backup inválido.");
}
};
reader.readAsText(file);
}

/* UTILIDADES */
function val(id){
let e=document.getElementById(id);
return e?e.value.trim():"";
}

function excluir(tipo,id){
if(!confirm("Deseja realmente excluir este registro?"))return;
db[tipo]=db[tipo].filter(x=>x.id!==id);
save();
}

render();
</script>

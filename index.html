<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#9A431F">
<link rel="manifest" href="manifest.json">
<title>Acervo Camila • Gestão</title>
<style>
:root{
 --creme:#F8E9DC;--creme2:#FFF8F2;--peach:#F3CDB5;--cobre:#B85B2B;
 --terracota:#9A431F;--marrom:#4B2115;--dourado:#C9894B;--texto:#4A2A20;
}
*{box-sizing:border-box}body{margin:0;background:var(--creme2);color:var(--texto);font-family:Arial,sans-serif}
header{height:74px;background:linear-gradient(90deg,var(--terracota),var(--cobre));color:#fff;display:flex;align-items:center;justify-content:space-between;padding:8px 20px;position:sticky;top:0;z-index:10}
.brand{display:flex;align-items:center;gap:12px}.brand img{width:52px;height:52px;object-fit:cover;border-radius:10px}.brand strong{font-family:Georgia,serif;font-size:20px;letter-spacing:1px}.brand small{display:block;opacity:.85}
nav{position:sticky;top:74px;z-index:9;background:var(--creme);border-bottom:1px solid #e5c7b4;display:flex;gap:6px;overflow:auto;padding:9px 12px}
nav button{border:0;background:transparent;color:var(--marrom);padding:10px 13px;border-radius:22px;white-space:nowrap;font-weight:600}
nav button.on{background:var(--cobre);color:#fff;box-shadow:0 3px 10px #8b3e1e33}
main{max-width:1100px;margin:auto;padding:18px}.tab{display:none}.tab.on{display:block}
.hero{background:linear-gradient(135deg,#fff8f2,#f5d7c2);border:1px solid #e9c4ad;border-radius:18px;padding:22px;margin-bottom:16px;box-shadow:0 3px 15px #7d3a1c12}
.hero h2{font-family:Georgia,serif;color:var(--terracota);margin:0 0 6px}.hero p{margin:0}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{background:#fffaf6;border:1px solid #edd6c7;border-radius:16px;padding:16px;box-shadow:0 2px 9px #7d3a1c10}
.card .label{font-size:13px}.big{font-family:Georgia,serif;font-size:25px;color:var(--terracota);font-weight:bold;margin-top:5px}
form{background:#fffaf6;border:1px solid #edd6c7;padding:16px;border-radius:16px;margin:14px 0}label{display:block;font-size:13px;margin-top:9px;font-weight:600}
input,select,textarea{width:100%;padding:11px;border:1px solid #dfc4b2;border-radius:9px;margin-top:5px;background:#fff;font:inherit;color:var(--texto)}
textarea{min-height:70px}.primary{background:var(--terracota);color:#fff;border:0;padding:11px 16px;border-radius:9px;margin-top:12px;font-weight:bold}
.secondary{background:var(--peach);color:var(--marrom);border:0;padding:10px 14px;border-radius:9px;margin-top:12px}
table{width:100%;border-collapse:collapse;background:#fffaf6;border-radius:14px;overflow:hidden;border:1px solid #edd6c7}
th{background:#f1d2bf;color:var(--marrom)}th,td{padding:9px;border-bottom:1px solid #f0ded2;text-align:left;font-size:12px}
.actions button{border:0;background:#f0ddd0;color:var(--marrom);padding:6px 8px;border-radius:7px;margin:2px}.ok{color:#39704b}.warn{color:#a45a20}.muted{color:#8a6b5d;font-size:12px}
.section-title{font-family:Georgia,serif;color:var(--terracota)}.logo-large{width:110px;height:70px;object-fit:cover;border-radius:12px;border:1px solid #e2b89c}
@media(min-width:750px){.grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<header><div class="brand"><img src="logo-acervo-camila.jpg"><div><strong>ACERVO CAMILA</strong><small>Sistema de Gestão de Brechó</small></div></div><div id="date"></div></header>
<nav id="nav"></nav><main id="app"></main>
<script>
const tabs=[["home","Início"],["prod","Estoque"],["forn","Fornecedores"],["venda","Vendas"],["receb","Recebimentos"],["desp","Despesas"],["rel","Relatórios"]];
let db=JSON.parse(localStorage.getItem("acervoCamila")||'{"fornecedores":[],"produtos":[],"clientes":[],"vendas":[],"recebimentos":[],"despesas":[]}');
const today=()=>new Date().toISOString().slice(0,10), uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function save(){localStorage.setItem("acervoCamila",JSON.stringify(db));render()}
function br(v){return Number(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}
function forn(id){return db.fornecedores.find(x=>x.id===id)?.nome||"—"}
function prod(id){return db.produtos.find(x=>x.id===id)}
function nav(){document.getElementById("nav").innerHTML=tabs.map((x,i)=>`<button id="n-${x[0]}" class="${i===0?'on':''}" onclick="show('${x[0]}')">${x[1]}</button>`).join("")}
function show(t){document.querySelectorAll("#nav button").forEach(x=>x.classList.remove("on"));document.getElementById("n-"+t).classList.add("on");render(t)}
function render(t="home"){
const el=document.getElementById("app");
if(t==="home"){let est=db.produtos.filter(x=>x.status==="Estoque").length,v=db.vendas.reduce((s,x)=>s+Number(x.total),0),r=db.recebimentos.reduce((s,x)=>s+Number(x.valor),0),d=db.despesas.reduce((s,x)=>s+Number(x.valor),0);
el.innerHTML=`<div class="hero"><h2>Bem-vinda ao seu Acervo Camila ✨</h2><p>Organize suas peças, fornecedores, vendas e recebimentos em um só lugar.</p></div><div class="grid">
<div class="card"><div class="label">Estoque total</div><div class="big">${est}</div><span class="muted">peças disponíveis</span></div>
<div class="card"><div class="label">Vendas</div><div class="big">${br(v)}</div><span class="muted">total registrado</span></div>
<div class="card"><div class="label">Recebimentos</div><div class="big">${br(r)}</div><span class="muted">dinheiro recebido</span></div>
<div class="card"><div class="label">Lucro de caixa*</div><div class="big">${br(r-d)}</div><span class="muted">recebimentos − despesas</span></div></div>
<form><h3 class="section-title">Comece por aqui</h3><p class="muted">Cadastre suas fornecedoras, depois as peças. Ao vender uma peça, registre a venda e depois os recebimentos.</p></form>`}
if(t==="forn"){el.innerHTML=`<h2 class="section-title">Fornecedores</h2><form onsubmit="addF(event)"><label>Nome<input id="fn" required></label><label>WhatsApp / contato<input id="fc"></label><label>Percentual de repasse (%)<input id="fp" type="number" step=".01" value="50"></label><label>Observações<textarea id="fo"></textarea></label><button class="primary">Cadastrar fornecedor</button></form><table><tr><th>Fornecedor</th><th>%</th><th>Estoque</th><th>Vendidas</th><th></th></tr>${db.fornecedores.map(f=>{let ps=db.produtos.filter(p=>p.fornecedor===f.id);return `<tr><td>${f.nome}<br>${f.contato||""}</td><td>${f.percentual}%</td><td>${ps.filter(p=>p.status==="Estoque").length}</td><td>${ps.filter(p=>p.status==="Vendido").length}</td><td><button onclick="delF('${f.id}')">Excluir</button></td></tr>`}).join("")}</table>`}
if(t==="prod"){el.innerHTML=`<h2 class="section-title">Estoque</h2><form onsubmit="addP(event)"><label>Código<input id="pcod" placeholder="AC-001"></label><label>Descrição<input id="pn" required placeholder="Vestido, blazer, bolsa..."></label><label>Marca<input id="pm"></label><label>Tamanho<input id="pt"></label><label>Categoria<input id="pcat" placeholder="Vestidos, casacos, calçados..."></label><label>Preço de venda<input id="pp" type="number" step=".01" required></label><label>Fornecedor<select id="pf" required><option value="">Selecione</option>${db.fornecedores.map(f=>`<option value="${f.id}">${f.nome}</option>`).join("")}</select></label><label>Valor de repasse/custo<input id="pcusto" type="number" step=".01"></label><label>Data de entrada<input id="pd" type="date" value="${today()}"></label><label>Observações<textarea id="po"></textarea></label><button class="primary">Adicionar ao estoque</button></form><input id="ps" oninput="listP(this.value)" placeholder="🔎 Pesquisar peça, marca, tamanho ou fornecedor"><div id="plist"></div>`;listP()}
if(t==="venda"){el.innerHTML=`<h2 class="section-title">Vendas</h2><form onsubmit="addV(event)"><label>Peça<select id="vp" required><option value="">Selecione</option>${db.produtos.filter(x=>x.status==="Estoque").map(x=>`<option value="${x.id}">${x.codigo||""} ${x.descricao} — ${br(x.preco)}</option>`).join("")}</select></label><label>Cliente<input id="vn"></label><label>WhatsApp<input id="vw"></label><label>Data<input id="vd" type="date" value="${today()}" required></label><label>Desconto<input id="vdesc" type="number" step=".01" value="0"></label><label>Observações<textarea id="vo"></textarea></label><button class="primary">Registrar venda</button></form><table><tr><th>Data</th><th>Peça</th><th>Cliente</th><th>Total</th></tr>${db.vendas.slice().reverse().map(x=>`<tr><td>${x.data}</td><td>${prod(x.produto)?.descricao||"—"}</td><td>${x.cliente||"—"}</td><td>${br(x.total)}</td></tr>`).join("")}</table>`}
if(t==="receb"){el.innerHTML=`<h2 class="section-title">Recebimentos</h2><form onsubmit="addR(event)"><label>Venda<select id="rv" required><option value="">Selecione</option>${db.vendas.map(x=>`<option value="${x.id}">${x.data} • ${prod(x.produto)?.descricao||""} • ${br(x.total)}</option>`).join("")}</select></label><label>Valor recebido<input id="rval" type="number" step=".01" required></label><label>Forma de pagamento<select id="rf"><option>Pix</option><option>Cartão</option><option>Dinheiro</option><option>Transferência</option><option>Outro</option></select></label><label>Data<input id="rd" type="date" value="${today()}" required></label><button class="primary">Registrar recebimento</button></form><table><tr><th>Data</th><th>Peça</th><th>Valor</th><th>Forma</th></tr>${db.recebimentos.slice().reverse().map(x=>{let v=db.vendas.find(v=>v.id===x.venda);return `<tr><td>${x.data}</td><td>${prod(v?.produto)?.descricao||"—"}</td><td>${br(x.valor)}</td><td>${x.forma}</td></tr>`}).join("")}</table>`}
if(t==="desp"){el.innerHTML=`<h2 class="section-title">Despesas</h2><form onsubmit="addD(event)"><label>Descrição<input id="dn" required></label><label>Categoria<select id="dc"><option>Frete</option><option>Embalagem</option><option>Publicidade</option><option>Taxas</option><option>Outros</option></select></label><label>Valor<input id="dv" type="number" step=".01" required></label><label>Data<input id="dd" type="date" value="${today()}" required></label><button class="primary">Lançar despesa</button></form><table><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Valor</th></tr>${db.despesas.slice().reverse().map(x=>`<tr><td>${x.data}</td><td>${x.descricao}</td><td>${x.categoria}</td><td>${br(x.valor)}</td></tr>`).join("")}</table>`}
if(t==="rel"){let v=db.vendas.reduce((s,x)=>s+Number(x.total),0),r=db.recebimentos.reduce((s,x)=>s+Number(x.valor),0),d=db.despesas.reduce((s,x)=>s+Number(x.valor),0);el.innerHTML=`<h2 class="section-title">Relatórios</h2><div class="grid"><div class="card">Vendas<div class="big">${br(v)}</div></div><div class="card">Recebido<div class="big">${br(r)}</div></div><div class="card">A receber<div class="big">${br(v-r)}</div></div><div class="card">Despesas<div class="big">${br(d)}</div></div></div><h3 class="section-title">Por fornecedor</h3><table><tr><th>Fornecedor</th><th>Estoque</th><th>Vendidas</th><th>Vendido</th><th>Repasse</th></tr>${db.fornecedores.map(f=>{let ps=db.produtos.filter(p=>p.fornecedor===f.id),vs=db.vendas.filter(v=>ps.some(p=>p.id===v.produto)),tot=vs.reduce((s,v)=>s+Number(v.total),0);return `<tr><td>${f.nome}</td><td>${ps.filter(p=>p.status==="Estoque").length}</td><td>${ps.filter(p=>p.status==="Vendido").length}</td><td>${br(tot)}</td><td>${br(tot*Number(f.percentual||0)/100)}</td></tr>`}).join("")}</table><form><h3 class="section-title">Backup</h3><button type="button" class="primary" onclick="backup()">Exportar dados</button> <button type="button" class="secondary" onclick="document.getElementById('imp').click()">Importar dados</button><input id="imp" type="file" accept=".json" style="display:none" onchange="importar(this)"></form>`}
}
function listP(q=""){let a=db.produtos.filter(x=>(`${x.codigo||""} ${x.descricao} ${x.marca||""} ${x.tamanho||""} ${forn(x.fornecedor)}`).toLowerCase().includes(q.toLowerCase()));document.getElementById("plist").innerHTML=`<table><tr><th>Peça</th><th>Fornecedor</th><th>Preço</th><th>Status</th><th></th></tr>${a.map(x=>`<tr><td><b>${x.codigo||"—"}</b><br>${x.descricao}<br><span class="muted">${x.marca||""} ${x.tamanho||""}</span></td><td>${forn(x.fornecedor)}</td><td>${br(x.preco)}</td><td class="${x.status==="Vendido"?"ok":"warn"}">${x.status}</td><td class="actions">${x.status==="Estoque"?`<button onclick="quick('${x.id}')">Vender</button>`:""}<button onclick="delP('${x.id}')">Excluir</button></td></tr>`).join("")}</table>`}
function val(id){return document.getElementById(id).value}
function addF(e){e.preventDefault();db.fornecedores.push({id:uid(),nome:val("fn"),contato:val("fc"),percentual:Number(val("fp")),obs:val("fo")});save();show("forn")}
function delF(i){if(db.produtos.some(x=>x.fornecedor===i))return alert("Há peças vinculadas a este fornecedor.");db.fornecedores=db.fornecedores.filter(x=>x.id!==i);save();show("forn")}
function addP(e){e.preventDefault();db.produtos.push({id:uid(),codigo:val("pcod"),descricao:val("pn"),marca:val("pm"),tamanho:val("pt"),categoria:val("pcat"),preco:Number(val("pp")),fornecedor:val("pf"),custo:Number(val("pcusto")||0),dataEntrada:val("pd"),obs:val("po"),status:"Estoque"});save();show("prod")}
function delP(i){if(confirm("Excluir esta peça?")){db.produtos=db.produtos.filter(x=>x.id!==i);save();show("prod")}}
function quick(i){show("venda");setTimeout(()=>document.getElementById("vp").value=i,50)}
function addV(e){e.preventDefault();let x=prod(val("vp")),total=Math.max(0,Number(x.preco)-Number(val("vdesc")||0));db.vendas.push({id:uid(),produto:x.id,cliente:val("vn"),whatsapp:val("vw"),data:val("vd"),desconto:Number(val("vdesc")||0),total,obs:val("vo")});x.status="Vendido";x.dataVenda=val("vd");save();show("venda")}
function addR(e){e.preventDefault();db.recebimentos.push({id:uid(),venda:val("rv"),valor:Number(val("rval")),forma:val("rf"),data:val("rd")});save();show("receb")}
function addD(e){e.preventDefault();db.despesas.push({id:uid(),descricao:val("dn"),categoria:val("dc"),valor:Number(val("dv")),data:val("dd")});save();show("desp")}
function backup(){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:"application/json"}));a.download="acervo-camila-backup.json";a.click()}
function importar(i){let r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);save();show("home")}catch(e){alert("Backup inválido")}};r.readAsText(i.files[0])}
document.getElementById("date").textContent=new Date().toLocaleDateString("pt-BR",{day:"2-digit",month:"long",year:"numeric"});
nav();render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("service-worker.js");
</script></body></html>

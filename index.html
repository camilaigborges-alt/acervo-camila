<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#9A431F">
<link rel="manifest" href="manifest.json">
<title>Acervo Camila • Gestão</title>
<style>
:root{--creme:#fff8f2;--fundo:#f8e9dc;--pessego:#f3cdb5;--cobre:#b85b2b;--terr:#9a431f;--marrom:#4b2115;--dourado:#c9894b;--linha:#ead0bd;--branco:#fffaf6}
*{box-sizing:border-box}body{margin:0;background:var(--creme);color:var(--marrom);font-family:Arial,sans-serif}header{background:linear-gradient(90deg,var(--terr),var(--cobre));color:#fff;padding:9px 18px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20}.brand{display:flex;align-items:center;gap:10px}.brand img{width:52px;height:52px;object-fit:cover;border-radius:10px}.brand b{font:22px Georgia,serif;letter-spacing:1px}.brand small{display:block}.hamb{display:none;background:#fff2;border:0;color:#fff;font-size:25px;padding:7px;border-radius:8px}
nav{display:flex;gap:6px;overflow:auto;background:var(--fundo);padding:8px 12px;position:sticky;top:70px;z-index:19;border-bottom:1px solid var(--linha)}nav button{border:0;background:transparent;color:var(--marrom);padding:10px 13px;border-radius:20px;white-space:nowrap;font-weight:600}nav button.on{background:var(--cobre);color:#fff}
main{max-width:1150px;margin:auto;padding:18px}.hero{background:linear-gradient(135deg,#fffaf6,#f5d5c0);border:1px solid var(--linha);padding:20px;border-radius:18px;margin-bottom:15px}.hero h2{margin:0 0 6px;font:27px Georgia,serif;color:var(--terr)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card,form,.panel{background:var(--branco);border:1px solid var(--linha);border-radius:15px;padding:15px;box-shadow:0 2px 9px #7d3a1c12}.card .big{font:25px Georgia,serif;color:var(--terr);font-weight:bold;margin-top:5px}.muted{color:#8b6d5d;font-size:12px}.title{font:22px Georgia,serif;color:var(--terr)}
label{display:block;font-size:13px;font-weight:bold;margin-top:9px}input,select,textarea{width:100%;padding:10px;border:1px solid #dfc1ad;border-radius:8px;background:#fff;font:inherit;color:var(--marrom);margin-top:4px}textarea{min-height:65px}.primary{background:var(--terr);color:#fff;border:0;padding:10px 14px;border-radius:8px;margin-top:12px;font-weight:bold}.secondary{background:var(--pessego);color:var(--marrom);border:0;padding:10px 14px;border-radius:8px;margin-top:12px}.danger{background:#f2d6cf;color:#8b2d1d;border:0;padding:7px 9px;border-radius:7px}
table{width:100%;border-collapse:collapse;background:var(--branco);border:1px solid var(--linha);border-radius:12px;overflow:hidden}th{background:#f1d1bd;color:var(--marrom)}th,td{padding:8px;border-bottom:1px solid #f0ddd2;text-align:left;font-size:12px}.actions button{border:0;background:#f1dfd3;color:var(--marrom);padding:6px 8px;border-radius:6px;margin:2px}.tag{display:inline-block;background:#f1dfd3;padding:3px 7px;border-radius:10px;font-size:11px}.ok{color:#32704a}.warn{color:#a65b20}.photo{width:48px;height:58px;object-fit:cover;border-radius:7px;border:1px solid var(--linha)}.photoBig{width:100%;max-height:280px;object-fit:contain;background:#f9eee6;border-radius:10px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.notice{padding:10px;border-radius:9px;background:#fff0e5;border:1px solid #e9c1a8;margin:8px 0}
@media(min-width:800px){.grid{grid-template-columns:repeat(4,1fr)}}@media(max-width:650px){.hamb{display:block}header .date{display:none}.two,.three{grid-template-columns:1fr}nav{top:70px}}
</style>
</head>
<body>
<header><div class="brand"><img src="logo-acervo-camila.jpg"><div><b>ACERVO CAMILA</b><small>Sistema de Gestão de Brechó</small></div></div><div class="date" id="date"></div><button class="hamb" onclick="document.getElementById('nav').scrollIntoView()">☰</button></header>
<nav id="nav"></nav><main id="app"></main>
<script>
const tabs=[["home","Início"],["prod","Estoque"],["forn","Fornecedores"],["cli","Clientes"],["venda","Vendas"],["receb","Recebimentos"],["rep","Repasses"],["desp","Despesas"],["rel","Relatórios"],["backup","Backup"]];
let db=JSON.parse(localStorage.getItem("acervoCamilaPro")||'{"fornecedores":[],"produtos":[],"clientes":[],"vendas":[],"recebimentos":[],"repasses":[],"despesas":[]}');
const today=()=>new Date().toISOString().slice(0,10), uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const val=id=>document.getElementById(id)?.value||"";
const br=v=>Number(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const forn=id=>db.fornecedores.find(x=>x.id===id);
const prod=id=>db.produtos.find(x=>x.id===id);
const venda=id=>db.vendas.find(x=>x.id===id);
function save(){localStorage.setItem("acervoCamilaPro",JSON.stringify(db));render()}
function nav(){document.getElementById("nav").innerHTML=tabs.map((x,i)=>`<button id="n-${x[0]}" class="${i===0?'on':''}" onclick="show('${x[0]}')">${x[1]}</button>`).join("")}
function show(t){document.querySelectorAll("#nav button").forEach(x=>x.classList.remove("on"));document.getElementById("n-"+t).classList.add("on");render(t)}
function render(t="home"){
const a=document.getElementById("app");
if(t==="home"){
 let estoque=db.produtos.filter(x=>x.status==="Estoque").length;
 let vendas=db.vendas.reduce((s,x)=>s+Number(x.total),0);
 let recebido=db.recebimentos.reduce((s,x)=>s+Number(x.valor),0);
 let despesas=db.despesas.reduce((s,x)=>s+Number(x.valor),0);
 let rep=db.repasses.reduce((s,x)=>s+Number(x.valor),0);
 a.innerHTML=`<div class="hero"><h2>Bem-vinda ao seu Acervo Camila ✨</h2><p>Peças que contam histórias. Agora com controle de estoque, vendas, clientes, recebimentos, repasses e financeiro.</p></div>
 <div class="grid"><div class="card">Estoque<div class="big">${estoque}</div><span class="muted">peças disponíveis</span></div><div class="card">Vendas<div class="big">${br(vendas)}</div></div><div class="card">Recebido<div class="big">${br(recebido)}</div></div><div class="card">Lucro de caixa<div class="big">${br(recebido-despesas-rep)}</div><span class="muted">recebimentos − despesas − repasses pagos</span></div></div>
 <form><h3 class="title">Como usar</h3><p>1. Cadastre as fornecedoras e o percentual de repasse. 2. Cadastre as peças com foto. 3. Registre as vendas. 4. Lance os recebimentos conforme forem pagos. 5. Registre os repasses às fornecedoras.</p><div class="notice">💾 Faça backups regularmente. Os dados ficam salvos neste navegador/dispositivo.</div></form>`;
}
if(t==="forn"){
 a.innerHTML=`<h2 class="title">Fornecedores</h2><form onsubmit="addF(event)"><div class="two"><div><label>Nome<input id="fn" required></label><label>WhatsApp<input id="fw"></label></div><div><label>Repasse padrão (%)<input id="fp" type="number" step=".01" value="50"></label><label>Observações<textarea id="fo"></textarea></label></div></div><button class="primary">Cadastrar fornecedora</button></form><table><tr><th>Fornecedor</th><th>Repasse</th><th>Estoque</th><th>Vendidas</th><th>Total vendido</th><th></th></tr>${db.fornecedores.map(f=>{let ps=db.produtos.filter(p=>p.fornecedor===f.id),vs=db.vendas.filter(v=>ps.some(p=>p.id===v.produto)),tot=vs.reduce((s,v)=>s+Number(v.total),0);return `<tr><td><b>${f.nome}</b><br>${f.whatsapp||""}</td><td>${f.percentual}%</td><td>${ps.filter(p=>p.status==="Estoque").length}</td><td>${ps.filter(p=>p.status==="Vendido").length}</td><td>${br(tot)}</td><td><button class="danger" onclick="delF('${f.id}')">Excluir</button></td></tr>`}).join("")}</table>`;
}
if(t==="cli"){
 a.innerHTML=`<h2 class="title">Clientes</h2><form onsubmit="addC(event)"><div class="two"><label>Nome<input id="cn" required></label><label>WhatsApp<input id="cw"></label></div><label>Observações<textarea id="co"></textarea></label><button class="primary">Cadastrar cliente</button></form><table><tr><th>Cliente</th><th>WhatsApp</th><th>Compras</th><th>Total</th></tr>${db.clientes.map(c=>{let vs=db.vendas.filter(v=>v.clienteId===c.id),tot=vs.reduce((s,v)=>s+Number(v.total),0);return `<tr><td>${c.nome}</td><td>${c.whatsapp||""}</td><td>${vs.length}</td><td>${br(tot)}</td></tr>`}).join("")}</table>`;
}
if(t==="prod"){
 a.innerHTML=`<h2 class="title">Estoque</h2><form onsubmit="addP(event)"><div class="three"><label>Código<input id="pcod" placeholder="AC-001"></label><label>Descrição<input id="pn" required></label><label>Marca<input id="pm"></label></div><div class="three"><label>Tamanho<input id="pt"></label><label>Categoria<input id="pcat" placeholder="Vestido, calçado..."></label><label>Preço de venda<input id="pp" type="number" step=".01" required></label></div><div class="three"><label>Fornecedor<select id="pf" required><option value="">Selecione</option>${db.fornecedores.map(f=>`<option value="${f.id}">${f.nome}</option>`).join("")}</select></label><label>Valor de repasse (opcional)<input id="pcusto" type="number" step=".01" placeholder="Se vazio, usa %"></label><label>Data de entrada<input id="pd" type="date" value="${today()}"></label></div><label>Foto da peça<input id="photo" type="file" accept="image/*"></label><label>Observações<textarea id="po"></textarea></label><button class="primary">Adicionar peça</button></form><input id="ps" oninput="listP(this.value)" placeholder="🔎 Pesquisar código, peça, marca, tamanho ou fornecedor"><div id="plist"></div>`;
 listP();
}
if(t==="venda"){
 let est=db.produtos.filter(x=>x.status==="Estoque");
 a.innerHTML=`<h2 class="title">Registrar venda</h2><form onsubmit="addV(event)"><label>Peça<select id="vp" required onchange="suggestPrice()"><option value="">Selecione</option>${est.map(x=>`<option value="${x.id}">${x.codigo||""} • ${x.descricao} • ${br(x.preco)}</option>`).join("")}</select></label><div class="two"><div><label>Cliente<select id="vc"><option value="">Sem cadastro</option>${db.clientes.map(c=>`<option value="${c.id}">${c.nome}</option>`).join("")}</select></label><label>Ou nome da cliente<input id="vn"></label></div><div><label>Data<input id="vd" type="date" value="${today()}"></label><label>Desconto<input id="vdesc" type="number" step=".01" value="0"></label></div></div><label>Observações<textarea id="vo"></textarea></label><button class="primary">Registrar venda e baixar do estoque</button></form><table><tr><th>Data</th><th>Peça</th><th>Cliente</th><th>Total</th><th>Recebido</th><th>Saldo</th></tr>${db.vendas.slice().reverse().map(v=>{let rec=db.recebimentos.filter(r=>r.venda===v.id).reduce((s,r)=>s+Number(r.valor),0);return `<tr><td>${v.data}</td><td>${prod(v.produto)?.descricao||"—"}</td><td>${v.clienteNome||"—"}</td><td>${br(v.total)}</td><td>${br(rec)}</td><td class="${v.total-rec>0?'warn':'ok'}">${br(Math.max(0,v.total-rec))}</td></tr>`}).join("")}</table>`;
}
if(t==="receb"){
 a.innerHTML=`<h2 class="title">Recebimentos</h2><form onsubmit="addR(event)"><label>Venda<select id="rv" required><option value="">Selecione</option>${db.vendas.map(v=>{let rec=db.recebimentos.filter(r=>r.venda===v.id).reduce((s,r)=>s+Number(r.valor),0),saldo=v.total-rec;return `<option value="${v.id}">${v.data} • ${v.clienteNome||"cliente"} • ${prod(v.produto)?.descricao||""} • saldo ${br(saldo)}</option>`}).join("")}</select></label><div class="three"><label>Valor recebido<input id="rval" type="number" step=".01" required></label><label>Forma<select id="rf"><option>Pix</option><option>Cartão</option><option>Dinheiro</option><option>Transferência</option><option>Outro</option></select></label><label>Data<input id="rd" type="date" value="${today()}"></label></div><button class="primary">Registrar recebimento</button></form><table><tr><th>Data</th><th>Cliente</th><th>Peça</th><th>Valor</th><th>Forma</th></tr>${db.recebimentos.slice().reverse().map(r=>{let v=venda(r.venda);return `<tr><td>${r.data}</td><td>${v?.clienteNome||"—"}</td><td>${prod(v?.produto)?.descricao||"—"}</td><td>${br(r.valor)}</td><td>${r.forma}</td></tr>`}).join("")}</table>`;
}
if(t==="rep"){
 a.innerHTML=`<h2 class="title">Repasses às fornecedoras</h2><form onsubmit="addRep(event)"><label>Fornecedor<select id="rpf" required><option value="">Selecione</option>${db.fornecedores.map(f=>`<option value="${f.id}">${f.nome}</option>`).join("")}</select></label><div class="three"><label>Valor pago<input id="rpv" type="number" step=".01" required></label><label>Data<input id="rpd" type="date" value="${today()}"></label><label>Observação<input id="rpo"></label></div><button class="primary">Registrar pagamento à fornecedora</button></form><table><tr><th>Data</th><th>Fornecedor</th><th>Valor pago</th><th>Obs.</th></tr>${db.repasses.slice().reverse().map(r=>`<tr><td>${r.data}</td><td>${forn(r.fornecedor)?.nome||"—"}</td><td>${br(r.valor)}</td><td>${r.obs||""}</td></tr>`).join("")}</table>`;
}
if(t==="desp"){
 a.innerHTML=`<h2 class="title">Despesas</h2><form onsubmit="addD(event)"><div class="three"><label>Descrição<input id="dn" required></label><label>Categoria<select id="dc"><option>Frete</option><option>Embalagem</option><option>Publicidade</option><option>Taxas</option><option>Outros</option></select></label><label>Valor<input id="dv" type="number" step=".01" required></label></div><label>Data<input id="dd" type="date" value="${today()}"></label><button class="primary">Lançar despesa</button></form><table><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Valor</th></tr>${db.despesas.slice().reverse().map(d=>`<tr><td>${d.data}</td><td>${d.descricao}</td><td>${d.categoria}</td><td>${br(d.valor)}</td></tr>`).join("")}</table>`;
}
if(t==="rel"){
 let vendas=db.vendas.reduce((s,v)=>s+Number(v.total),0),rec=db.recebimentos.reduce((s,r)=>s+Number(r.valor),0),des=db.despesas.reduce((s,d)=>s+Number(d.valor),0),rep=db.repasses.reduce((s,r)=>s+Number(r.valor),0);
 a.innerHTML=`<h2 class="title">Relatórios e financeiro</h2><div class="grid"><div class="card">Vendas<div class="big">${br(vendas)}</div></div><div class="card">Recebido<div class="big">${br(rec)}</div></div><div class="card">A receber<div class="big">${br(Math.max(0,vendas-rec))}</div></div><div class="card">Despesas<div class="big">${br(des)}</div></div></div><div class="panel" style="margin-top:14px"><h3>Resultado de caixa</h3><p>Recebimentos: <b>${br(rec)}</b></p><p>− Despesas: <b>${br(des)}</b></p><p>− Repasses pagos: <b>${br(rep)}</b></p><h2 style="color:var(--terr)">${br(rec-des-rep)}</h2></div><h3 class="title">Resumo por fornecedora</h3><table><tr><th>Fornecedor</th><th>Estoque</th><th>Vendidas</th><th>Vendas</th><th>Repasse estimado</th><th>Repasses pagos</th></tr>${db.fornecedores.map(f=>{let ps=db.produtos.filter(p=>p.fornecedor===f.id),vs=db.vendas.filter(v=>ps.some(p=>p.id===v.produto)),tot=vs.reduce((s,v)=>s+Number(v.total),0),estim=ps.reduce((s,p)=>{let vv=vs.find(v=>v.produto===p.id);return s+(vv?(p.custo||vv.total*Number(f.percentual||0)/100):0)},0),pag=db.repasses.filter(r=>r.fornecedor===f.id).reduce((s,r)=>s+Number(r.valor),0);return `<tr><td>${f.nome}</td><td>${ps.filter(p=>p.status==="Estoque").length}</td><td>${ps.filter(p=>p.status==="Vendido").length}</td><td>${br(tot)}</td><td>${br(estim)}</td><td>${br(pag)}</td></tr>`}).join("")}</table>`;
}
if(t==="backup"){
 a.innerHTML=`<h2 class="title">Backup e segurança</h2><form><p>Faça uma cópia dos seus dados para guardar no computador ou no iCloud/Arquivos.</p><button type="button" class="primary" onclick="backup()">⬇ Exportar backup</button> <button type="button" class="secondary" onclick="document.getElementById('imp').click()">⬆ Importar backup</button><input id="imp" type="file" accept=".json" style="display:none" onchange="importar(this)"><div class="notice">⚠️ O sistema salva os dados neste navegador. O backup é a sua segurança caso o navegador seja apagado ou o dispositivo seja trocado.</div></form>`;
}}
function listP(q=""){let arr=db.produtos.filter(x=>(`${x.codigo||""} ${x.descricao} ${x.marca||""} ${x.tamanho||""} ${forn(x.fornecedor)?.nome||""}`).toLowerCase().includes(q.toLowerCase()));document.getElementById("plist").innerHTML=`<table><tr><th>Foto</th><th>Peça</th><th>Fornecedor</th><th>Preço</th><th>Status</th><th></th></tr>${arr.map(x=>`<tr><td>${x.foto?`<img class="photo" src="${x.foto}">`:"—"}</td><td><b>${x.codigo||"—"}</b><br>${x.descricao}<br><span class="muted">${x.marca||""} ${x.tamanho||""}</span></td><td>${forn(x.fornecedor)?.nome||"—"}</td><td>${br(x.preco)}</td><td class="${x.status==="Vendido"?"ok":"warn"}">${x.status}</td><td class="actions">${x.status==="Estoque"?`<button onclick="quick('${x.id}')">Vender</button>`:""}<button onclick="delP('${x.id}')">Excluir</button></td></tr>`).join("")}</table>`}
function addF(e){e.preventDefault();db.fornecedores.push({id:uid(),nome:val("fn"),whatsapp:val("fw"),percentual:Number(val("fp")),obs:val("fo")});save();show("forn")}
function delF(i){if(db.produtos.some(x=>x.fornecedor===i))return alert("Há peças vinculadas a esta fornecedora.");db.fornecedores=db.fornecedores.filter(x=>x.id!==i);save();show("forn")}
function addC(e){e.preventDefault();db.clientes.push({id:uid(),nome:val("cn"),whatsapp:val("cw"),obs:val("co")});save();show("cli")}
function addP(e){e.preventDefault();let file=document.getElementById("photo").files[0];let finish=foto=>{db.produtos.push({id:uid(),codigo:val("pcod"),descricao:val("pn"),marca:val("pm"),tamanho:val("pt"),categoria:val("pcat"),preco:Number(val("pp")),fornecedor:val("pf"),custo:Number(val("pcusto")||0),dataEntrada:val("pd"),obs:val("po"),foto,status:"Estoque"});save();show("prod")};if(file){let r=new FileReader();r.onload=()=>finish(r.result);r.readAsDataURL(file)}else finish("")}
function delP(i){if(confirm("Excluir esta peça?")){db.produtos=db.produtos.filter(x=>x.id!==i);save();show("prod")}}
function quick(i){show("venda");setTimeout(()=>document.getElementById("vp").value=i,50)}
function addV(e){e.preventDefault();let x=prod(val("vp"));if(!x)return;let cliId=val("vc"),nome=val("vn").trim()||db.clientes.find(c=>c.id===cliId)?.nome||"Sem cadastro";let total=Math.max(0,Number(x.preco)-Number(val("vdesc")));db.vendas.push({id:uid(),produto:x.id,clienteId:cliId,clienteNome:nome,data:val("vd"),desconto:Number(val("vdesc")),total,obs:val("vo")});x.status="Vendido";x.dataVenda=val("vd");save();show("venda")}
function suggestPrice(){let x=prod(val("vp"));if(x){}}
function addR(e){e.preventDefault();db.recebimentos.push({id:uid(),venda:val("rv"),valor:Number(val("rval")),forma:val("rf"),data:val("rd")});save();show("receb")}
function addRep(e){e.preventDefault();db.repasses.push({id:uid(),fornecedor:val("rpf"),valor:Number(val("rpv")),data:val("rpd"),obs:val("rpo")});save();show("rep")}
function addD(e){e.preventDefault();db.despesas.push({id:uid(),descricao:val("dn"),categoria:val("dc"),valor:Number(val("dv")),data:val("dd")});save();show("desp")}
function backup(){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:"application/json"}));a.download="acervo-camila-backup.json";a.click()}
function importar(i){let r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);save();show("home")}catch(e){alert("Backup inválido")}};if(i.files[0])r.readAsText(i.files[0])}
document.getElementById("date").textContent=new Date().toLocaleDateString("pt-BR",{day:"2-digit",month:"long",year:"numeric"});
nav();render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("service-worker.js");
</script></body></html>

<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#171717"><link rel="manifest" href="manifest.json"><title>Acervo Camila</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f2ee;color:#222;font-family:Arial,sans-serif}header{background:#171717;color:#fff;padding:16px;position:sticky;top:0;z-index:10}header h1{margin:0;font-size:22px}header small{opacity:.7}
nav{display:flex;gap:6px;overflow:auto;background:#fff;padding:8px;position:sticky;top:65px;z-index:9;border-bottom:1px solid #ddd}nav button{border:0;border-radius:20px;padding:9px 12px;white-space:nowrap}nav .on{background:#171717;color:#fff}
main{max-width:1000px;margin:auto;padding:14px}.tab{display:none}.tab.on{display:block}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.box{background:#fff;padding:14px;border-radius:14px;box-shadow:0 1px 5px #0001}.big{font-size:23px;font-weight:bold}
form{background:#fff;padding:14px;border-radius:14px;margin:12px 0}label{display:block;font-size:13px;margin-top:9px}input,select,textarea{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;margin-top:4px;font:inherit}textarea{min-height:65px}button.primary{background:#171717;color:white;border:0;padding:10px 14px;border-radius:8px;margin-top:12px}button.secondary{border:0;padding:9px 12px;border-radius:8px}
table{width:100%;border-collapse:collapse;background:white;border-radius:12px;overflow:hidden}th,td{padding:8px;border-bottom:1px solid #eee;text-align:left;font-size:12px}.actions button{border:0;padding:5px 7px;border-radius:6px;margin:2px}.ok{color:#16713b}.warn{color:#a06000}.muted{color:#777;font-size:12px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}.tag{display:inline-block;background:#eee;padding:3px 7px;border-radius:10px;font-size:11px}
</style></head><body>
<header><h1>Acervo Camila</h1><small>Brechó online • gestão completa</small></header>
<nav id="nav"></nav><main id="app"></main>
<script>
const tabs=[["home","Início"],["prod","Estoque"],["forn","Fornecedores"],["venda","Vendas"],["receb","Recebimentos"],["desp","Despesas"],["rel","Relatórios"]];
let db=JSON.parse(localStorage.getItem("acervoCamilaV2")||'{"fornecedores":[],"produtos":[],"clientes":[],"vendas":[],"recebimentos":[],"despesas":[]}');
const today=()=>new Date().toISOString().slice(0,10), uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function save(){localStorage.setItem("acervoCamilaV2",JSON.stringify(db));render()}
function br(v){return Number(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}
function f(id){return db.fornecedores.find(x=>x.id===id)?.nome||"—"}
function p(id){return db.produtos.find(x=>x.id===id)}
function c(id){return db.clientes.find(x=>x.id===id)?.nome||"—"}
function show(t){document.querySelectorAll("nav button").forEach(x=>x.classList.remove("on"));document.getElementById("n-"+t).classList.add("on");render(t)}
function nav(){navx.innerHTML=tabs.map((x,i)=>`<button id="n-${x[0]}" class="${i==0?'on':''}" onclick="show('${x[0]}')">${x[1]}</button>`).join("")}
function render(t="home"){
let el=app;
if(t==="home"){let est=db.produtos.filter(x=>x.status==="Estoque").length, vend=db.vendas.reduce((s,x)=>s+Number(x.total),0), rec=db.recebimentos.reduce((s,x)=>s+Number(x.valor),0), des=db.despesas.reduce((s,x)=>s+Number(x.valor),0);el.innerHTML=`<h2>Painel</h2><div class="grid"><div class="box">Em estoque<br><span class="big">${est}</span></div><div class="box">Vendas<br><span class="big">${br(vend)}</span></div><div class="box">Recebido<br><span class="big">${br(rec)}</span></div><div class="box">Despesas<br><span class="big">${br(des)}</span></div></div><form><h3>Resumo financeiro</h3><p>Resultado de caixa registrado: <b>${br(rec-des)}</b></p><p class="muted">Cadastre fornecedores e peças primeiro. Depois registre vendas, recebimentos e despesas.</p></form>`}
if(t==="forn"){el.innerHTML=`<h2>Fornecedores</h2><form onsubmit="addF(event)"><label>Nome / fornecedora<input id="fn" required></label><label>WhatsApp / contato<input id="fc"></label><label>Percentual do fornecedor (%)<input id="fperc" type="number" step=".01" value="50"></label><label>Observações<textarea id="fo"></textarea></label><button class="primary">Cadastrar</button></form><table><tr><th>Fornecedor</th><th>%</th><th>Peças</th><th>Vendidas</th><th></th></tr>${db.fornecedores.map(x=>{let ps=db.produtos.filter(q=>q.fornecedor===x.id);return `<tr><td>${x.nome}<br>${x.contato||""}</td><td>${x.percentual}%</td><td>${ps.filter(q=>q.status==="Estoque").length}</td><td>${ps.filter(q=>q.status==="Vendido").length}</td><td><button onclick="delF('${x.id}')">Excluir</button></td></tr>`}).join("")}</table>`}
if(t==="prod"){el.innerHTML=`<h2>Estoque</h2><form onsubmit="addP(event)"><label>Código da peça<input id="pcod" placeholder="Ex.: AC-001"></label><label>Descrição<input id="pn" required placeholder="Vestido, blazer..."></label><label>Marca<input id="pm"></label><label>Tamanho<input id="pt"></label><label>Preço de venda<input id="pp" type="number" step=".01" required></label><label>Fornecedor<select id="pf" required><option value="">Selecione</option>${db.fornecedores.map(x=>`<option value="${x.id}">${x.nome}</option>`).join("")}</select></label><label>Custo/valor repassado ao fornecedor<input id="pc" type="number" step=".01" placeholder="Opcional"></label><label>Data de entrada<input id="pd" type="date" value="${today()}"></label><label>Observações<textarea id="po"></textarea></label><button class="primary">Adicionar peça</button></form><input id="ps" oninput="listP(this.value)" placeholder="Pesquisar código, peça, marca, tamanho ou fornecedor"><div id="plist"></div>`;listP()}
if(t==="venda"){el.innerHTML=`<h2>Registrar venda</h2><form onsubmit="addVenda(event)"><label>Peça<select id="vp" required><option value="">Selecione</option>${db.produtos.filter(x=>x.status==="Estoque").map(x=>`<option value="${x.id}">${x.codigo||""} ${x.descricao} — ${br(x.preco)}</option>`).join("")}</select></label><label>Cliente<input id="vn" placeholder="Nome da cliente"></label><label>WhatsApp<input id="vw"></label><label>Data da venda<input id="vd" type="date" value="${today()}" required></label><label>Desconto<input id="vdesc" type="number" step=".01" value="0"></label><label>Observações<textarea id="vo"></textarea></label><button class="primary">Registrar venda</button></form><h3>Vendas realizadas</h3><table><tr><th>Data</th><th>Peça</th><th>Cliente</th><th>Total</th></tr>${db.vendas.slice().reverse().map(x=>`<tr><td>${x.data}</td><td>${p(x.produto)?.descricao||"—"}</td><td>${x.cliente||"—"}</td><td>${br(x.total)}</td></tr>`).join("")}</table>`}
if(t==="receb"){el.innerHTML=`<h2>Recebimentos</h2><form onsubmit="addR(event)"><label>Venda<select id="rvenda" required><option value="">Selecione</option>${db.vendas.map(x=>`<option value="${x.id}">${x.data} — ${p(x.produto)?.descricao||""} — ${x.cliente||"sem cliente"} — ${br(x.total)}</option>`).join("")}</select></label><label>Valor recebido<input id="rval" type="number" step=".01" required></label><label>Forma de pagamento<select id="rforma"><option>Pix</option><option>Cartão</option><option>Dinheiro</option><option>Transferência</option><option>Outro</option></select></label><label>Data do recebimento<input id="rdate" type="date" value="${today()}" required></label><button class="primary">Registrar recebimento</button></form><table><tr><th>Data</th><th>Venda</th><th>Valor</th><th>Forma</th></tr>${db.recebimentos.slice().reverse().map(x=>`<tr><td>${x.data}</td><td>${p(db.vendas.find(v=>v.id===x.venda)?.produto)?.descricao||"—"}</td><td>${br(x.valor)}</td><td>${x.forma}</td></tr>`).join("")}</table>`}
if(t==="desp"){el.innerHTML=`<h2>Despesas</h2><form onsubmit="addD(event)"><label>Descrição<input id="dn" required placeholder="Embalagem, frete, anúncio..."></label><label>Categoria<select id="dc"><option>Frete</option><option>Embalagem</option><option>Publicidade</option><option>Taxas</option><option>Outros</option></select></label><label>Valor<input id="dv" type="number" step=".01" required></label><label>Data<input id="dd" type="date" value="${today()}" required></label><button class="primary">Lançar despesa</button></form><table><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Valor</th></tr>${db.despesas.slice().reverse().map(x=>`<tr><td>${x.data}</td><td>${x.descricao}</td><td>${x.categoria}</td><td>${br(x.valor)}</td></tr>`).join("")}</table>`}
if(t==="rel"){let total=db.vendas.reduce((s,x)=>s+Number(x.total),0),rec=db.recebimentos.reduce((s,x)=>s+Number(x.valor),0),des=db.despesas.reduce((s,x)=>s+Number(x.valor),0);el.innerHTML=`<h2>Relatórios</h2><div class="grid"><div class="box">Vendas<br><span class="big">${br(total)}</span></div><div class="box">Recebido<br><span class="big">${br(rec)}</span></div><div class="box">A receber<br><span class="big">${br(total-rec)}</span></div><div class="box">Despesas<br><span class="big">${br(des)}</span></div></div><h3>Resumo por fornecedor</h3><table><tr><th>Fornecedor</th><th>Estoque</th><th>Vendidas</th><th>Valor vendido</th><th>Repasse estimado</th></tr>${db.fornecedores.map(x=>{let ps=db.produtos.filter(q=>q.fornecedor===x.id),vv=db.vendas.filter(v=>ps.some(q=>q.id===v.produto)),tot=vv.reduce((s,v)=>s+Number(v.total),0),rep=tot*Number(x.percentual||0)/100;return `<tr><td>${x.nome}</td><td>${ps.filter(q=>q.status==="Estoque").length}</td><td>${ps.filter(q=>q.status==="Vendido").length}</td><td>${br(tot)}</td><td>${br(rep)}</td></tr>`}).join("")}</table><form><h3>Backup</h3><button type="button" class="primary" onclick="backup()">Exportar backup</button> <button type="button" class="secondary" onclick="imp.click()">Importar backup</button><input id="imp" type="file" accept=".json" style="display:none" onchange="importar(this)"></form>`}
}
function listP(q=""){let a=db.produtos.filter(x=>(`${x.codigo||""} ${x.descricao} ${x.marca||""} ${x.tamanho||""} ${f(x.fornecedor)}`).toLowerCase().includes(q.toLowerCase()));plist.innerHTML=`<table><tr><th>Código/Peça</th><th>Fornecedor</th><th>Preço</th><th>Status</th><th></th></tr>${a.map(x=>`<tr><td><b>${x.codigo||"—"}</b><br>${x.descricao}<br><span class="muted">${x.marca||""} ${x.tamanho||""}</span></td><td>${f(x.fornecedor)}</td><td>${br(x.preco)}</td><td class="${x.status==="Vendido"?"ok":"warn"}">${x.status}</td><td class="actions">${x.status==="Estoque"?`<button onclick="quickSell('${x.id}')">Vender</button>`:""}<button onclick="delP('${x.id}')">Excluir</button></td></tr>`).join("")}</table>`}
function addF(e){e.preventDefault();db.fornecedores.push({id:uid(),nome:fn.value,contato:fc.value,percentual:Number(fperc.value),obs:fo.value});save();show("forn")}
function delF(i){if(db.produtos.some(x=>x.fornecedor===i))return alert("Fornecedor possui peças vinculadas.");db.fornecedores=db.fornecedores.filter(x=>x.id!==i);save();show("forn")}
function addP(e){e.preventDefault();db.produtos.push({id:uid(),codigo:pcod.value,descricao:pn.value,marca:pm.value,tamanho:pt.value,preco:Number(pp.value),custo:Number(pc.value||0),fornecedor:pf.value,dataEntrada:pd.value,obs:po.value,status:"Estoque"});save();show("prod")}
function delP(i){if(confirm("Excluir esta peça?")){db.produtos=db.produtos.filter(x=>x.id!==i);save();show("prod")}}
function quickSell(i){show("venda");setTimeout(()=>{vp.value=i},20)}
function addVenda(e){e.preventDefault();let x=p(vp.value),cl=vn.value.trim();let total=Math.max(0,Number(x.preco)-Number(vdesc.value||0));if(cl&&!db.clientes.some(z=>z.nome.toLowerCase()===cl.toLowerCase()))db.clientes.push({id:uid(),nome:cl,whatsapp:vw.value});db.vendas.push({id:uid(),produto:x.id,cliente:cl,whatsapp:vw.value,data:vd.value,desconto:Number(vdesc.value||0),total,obs:vo.value});x.status="Vendido";x.dataVenda=vd.value;save();show("venda")}
function addR(e){e.preventDefault();db.recebimentos.push({id:uid(),venda:rvenda.value,valor:Number(rval.value),forma:rforma.value,data:rdate.value});save();show("receb")}
function addD(e){e.preventDefault();db.despesas.push({id:uid(),descricao:dn.value,categoria:dc.value,valor:Number(dv.value),data:dd.value});save();show("desp")}
function backup(){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:"application/json"}));a.download="acervo-camila-backup.json";a.click()}
function importar(i){let r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);save();show("home")}catch(e){alert("Backup inválido")}};r.readAsText(i.files[0])}
nav();render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("service-worker.js");
</script></body></html>
